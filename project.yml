name: Screenme
options:
  bundleIdPrefix: dev.mariomiletta
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Screenme:
    type: application
    platform: macOS
    sources: [Sources/Screenme]
    info:
      path: Sources/Screenme/Info.plist
      properties:
        CFBundleName: Screenme
        CFBundleDisplayName: Screenme
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "MIT License"
        NSMicrophoneUsageDescription: "Screenme records your voice with screen recordings when you turn the microphone on."
        NSSpeechRecognitionUsageDescription: "Screenme transcribes what you say in a recording, on this Mac, when you make a Bug Report."
        NSCameraUsageDescription: "Screenme shows your camera in a bubble on screen recordings when you turn the camera on."
        CFBundleURLTypes:
          - CFBundleURLName: dev.mariomiletta.Screenme
            CFBundleURLSchemes: [screenme]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mariomiletta.Screenme
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # The `screenme` command line tool, in Contents/Helpers: Contents/MacOS already has `Screenme`,
      # and the default file system does not tell the two names apart.
      - target: screenme-cli
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    scheme:
      testTargets: [ScreenmeTests, ScreenmeCLITests, ScreenmeUITests]
  screenme-cli:
    type: tool
    platform: macOS
    sources: [Sources/ScreenmeCLI]
    settings:
      base:
        PRODUCT_NAME: screenme
        # A module named "screenme" would overwrite the app's Screenme.swiftmodule on a case-insensitive disk.
        PRODUCT_MODULE_NAME: ScreenmeCLI
        PRODUCT_BUNDLE_IDENTIFIER: dev.mariomiletta.Screenme.cli
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  ScreenmeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ScreenmeTests]
    dependencies:
      - target: Screenme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mariomiletta.ScreenmeTests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
  ScreenmeCLITests:
    type: bundle.unit-test
    platform: macOS
    # The tool's sources compiled into the test bundle; main.swift runs the tool, so it stays out.
    sources:
      - Tests/ScreenmeCLITests
      - path: Sources/ScreenmeCLI
        excludes: [main.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mariomiletta.ScreenmeCLITests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
  ScreenmeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/ScreenmeUITests]
    dependencies:
      - target: Screenme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mariomiletta.ScreenmeUITests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Screenme
